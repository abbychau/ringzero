name: Publish to winget

# Manually re-submit a GitHub release to microsoft/winget-pkgs. Automatic
# submission happens inside the "Portable builds" workflow after the release
# assets are built (a release created by a workflow does not fire the
# `release: published` event), so this exists for re-running a failed
# submission or publishing an older release.
#
# Requires a WINGET_TOKEN repo secret: a GitHub PAT with `public_repo` scope,
# used to fork winget-pkgs and open the PR. The package must already exist in
# winget-pkgs — see winget/Abbychau.RingZero.installer.yaml for the one-time
# first submission.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'GitHub release tag to publish to winget (e.g. v0.5.0)'
        required: true

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - name: Submit update to microsoft/winget-pkgs
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: Abbychau.RingZero
          installers-regex: '^ringzero-win-x64\.exe$'
          release-tag: ${{ inputs.release-tag }}
          token: ${{ secrets.WINGET_TOKEN }}
          max-versions-to-keep: 0

name: Portable builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:portable
      - name: Build single-file launcher (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:sfx
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: build/portable/ringzero-*
      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cd "$GITHUB_WORKSPACE"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --generate-notes || true
          gh release upload "$tag" build/portable/ringzero-* --clobber
